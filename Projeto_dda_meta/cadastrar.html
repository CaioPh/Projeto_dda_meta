<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <header><h1>DDA Metalurgica</h1></header>
    <nav>
        <a href="index.html">Inicio</a> |
        <strong>Cadastro</strong> |
        <a href="produtos.html">Produtos</a> |
        <a href="movimentacao.html">Movimentação</a> |
        <a href="configuracao.html">Configuração</a> |
        <button>Sair</button>
    </nav>

   <main>
    <!-- Título principal da página -->
    <h2>Cadastro de Estoque</h2>
    
    <form action="cadastrar.html" method="post" id="form-cadastro">
        
        <!-- SEÇÃO 1: Dados Técnicos da Pastilha -->
        <section>
            <h3>Dados da Pastilha</h3>
            
            <p>
                <label for="codigo-iso">Código ISO da Pastilha:</label>
                <input type="text" id="codigo-iso" name="codigo_iso" placeholder="Ex: CNMG 120408-PM" required>
            </p>

            <p>
                <label for="fabricante">Fabricante / Marca:</label>
                <input type="text" id="fabricante" name="fabricante" placeholder="Ex: Sandvik" required>
            </p>

            <p>
                <label for="classe">Classe do Fabricante:</label>
                <input type="text" id="classe" name="classe" placeholder="Ex: GC4325" required>
            </p>

            <p>
                <label for="aplicacao-iso">Aplicação Principal (Grupo ISO):</label>
                <select id="aplicacao-iso" name="aplicacao_iso" required>
                    <option value="" disabled selected>Selecione o material...</option>
                    <option value="P">P - Aço Carbono</option>
                    <option value="M">M - Aço Inox</option>
                    <option value="K">K - Ferro Fundido</option>
                    <option value="N">N - Materiais Não Ferrosos</option>
                    <option value="S">S - Superligas / Titânio</option>
                    <option value="H">H - Materiais Endurecidos</option>
                </select>
            </p>

            <p>
                <label for="arestas">Quantidade de Arestas de Corte:</label>
                <input type="number" id="arestas" name="arestas" min="1" max="10" placeholder="Ex: 4" required>
            </p>
        </section>

        <hr>

        <!--Dados de Logística e Armazenamento -->
        <section>
            <h3>Controle de Estoque e Localização</h3>

            <p>
                <label for="estoque-atual">Quantidade Atual em Estoque (Unidades):</label>
                <input type="number" id="estoque-atual" name="estoque_atual" min="0" placeholder="0" required>
            </p>

            <p>
                <label for="estoque-minimo">Estoque Mínimo de Segurança:</label>
                <input type="number" id="estoque-minimo" name="estoque_minimo" min="0" placeholder="0" required>
            </p>

            <p>
                <label for="localizacao">Localização Física no Almoxarifado:</label>
                <input type="text" id="localizacao" name="localizacao" placeholder="Ex: Prateleira A - Gaveta 2" required>
            </p>
        </section>

        <!-- Botão de envio fora das seções, mas dentro do formulário -->
        <button type="submit">Salvar no Estoque</button>
    </form>
</main>

    <footer>
        <h2>&copy;2026 Gerenciamento de Estoque</h2>
        
    </footer>

 <script src="cadastrar.js"></script>
    
</body>
</html>
