<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CEPAD</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

    <div class="login-container">

        <header class="login-brand">
            <h1>CEPAD</h1>
        </header>

        <main class="login-card">

            <h2>Acesse sua conta</h2>

            <form action="inicio.html" method="get">

                <label for="usuario">E-mail ou usuário</label>
                <input type="text" id="usuario" name="usuario" placeholder="Insira seu usuário ou e-mail">

                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="Insira sua senha">

                <button type="submit" class="login-button">
                    Entrar
                </button>

            </form>

        </main>

        <p class="login-description">
            Sistema de Gerenciamento de Estoque
        </p>

        <footer class="login-footer">
            © 2026 CEPAD - Todos os direitos reservados
        </footer>

    </div>

</body>

</html>
